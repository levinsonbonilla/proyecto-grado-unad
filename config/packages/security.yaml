security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
        
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Users\Users
                property: email
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: security_login
                check_path: security_login
                default_target_path: store
                enable_csrf: true
                success_handler: App\Security\CustomAuthenticationSuccessHandler
            logout:
                path: security_logout
                target: store
            remember_me:
                secret: "%kernel.secret%"
                always_remember_me: true

    access_control:
        - { path: ^/(es|en|br)/checkout, roles: ROLE_USER }
        - { path: ^/(es|en|br)/orders, roles: ROLE_USER }
        - { path: ^/(es|en|br)/profile, roles: ROLE_USER }
        - { path: ^/(es|en|br)/private, roles: [ROLE_SUPER_ADMIN, ROLE_ADMIN] }
        - { path: ^/(es|en|br)/dashboard, roles: [ROLE_SUPER_ADMIN, ROLE_ADMIN] }
        
    role_hierarchy:
        ROLE_USER: [ROLE_USER]
        ROLE_ADMIN: [ROLE_ADMIN]
        ROLE_SUPER_ADMIN: [ROLE_USER, ROLE_ADMIN, ROLE_SUPER_ADMIN]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
