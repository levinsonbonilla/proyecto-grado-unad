framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    default_locale: '%locale%'

    # Detrás de Cloudflare: confía en quien conecta directo (REMOTE_ADDR) para
    # leer X-Forwarded-For y así obtener la IP real del visitante, no la de
    # borde de Cloudflare (afecta GeoIP: idioma detectado y estadísticas).
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_domain: '%env(string:SESSION_COOKIE_DOMAIN)%'
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true
    
    assets:
        base_urls: '%cdn_base_url%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        form:
            csrf_protection:
                enabled: false
