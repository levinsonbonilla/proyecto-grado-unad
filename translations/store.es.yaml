about_title: Nosotros
about_our_story_title: Nuestra historia
about_our_story_p1: Acá va la historia de tu tienda. Cada negocio detrás de esta tienda tiene su propio comienzo — reemplaza este párrafo con cómo empezó la tuya, qué te propusiste vender y qué la hace valer la pena contar.
about_our_story_p2: Usa este segundo párrafo para lo que cambió desde entonces — cómo creció el catálogo, a quién le vendes hoy y qué distingue a tu tienda del resto.
about_our_story_p3: ¿Alguna pregunta? Contáctanos en la tienda o a través de la página de contacto.
about_our_mission_title: Nuestra misión
about_our_mission_p1: Acá va la misión de tu tienda — qué quieres que sientan los clientes al comprarte, y el estándar al que sometes tus productos y servicio. Reemplaza este párrafo con eso.
about_mission_quote: La creatividad es solo conectar cosas. Cuando le preguntas a gente creativa cómo hicieron algo, se sienten un poco culpables porque en realidad no lo hicieron, solo vieron algo. Les pareció obvio después de un tiempo.

