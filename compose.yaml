name: proyecto-grado-unad

services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_cache_data:/var/www/html/var/cache
      - composer_cache:/home/www-data/.composer
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 10s
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - var_cache_data:/var/www/html/var/cache
      - composer_cache:/home/www-data/.composer
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_healthy
    command: >
      php bin/console messenger:consume async
      --time-limit=3600 --memory-limit=128M -vv
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8060:80"
      - "80:80"
      - "8090:8090"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proyecto_grado_unad}
      MYSQL_USER: ${MYSQL_USER:-proyecto_grado_unad}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-proyecto_grado_unad}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  minio-seed:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../thorha-assets:/seed:ro
    networks:
      - proyecto-grado-unad
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/proyecto-grado-unad-assets &&
      mc anonymous set download local/proyecto-grado-unad-assets &&
      mc mirror --exclude '.git/**' /seed/ local/proyecto-grado-unad-assets &&
      echo 'Seed de proyecto-grado-unad-assets completado.'
      "
    restart: "no"

  payment-gateway:
    build:
      context: ./docker/payment-gateway
    environment:
      PAYMENT_GATEWAY_SECRET: ${PAYMENT_GATEWAY_SECRET:-dev-secret-change-me}
      SELF_BASE_URL: http://localhost:8070
    ports:
      - "8070:8070"
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - proyecto-grado-unad
    restart: unless-stopped

  dns:
    build:
      context: ./docker/dns
    ports:
      - "${WSL_DNS_BIND_IP:-0.0.0.0}:53:53/udp"
      - "${WSL_DNS_BIND_IP:-0.0.0.0}:53:53/tcp"
    networks:
      - proyecto-grado-unad
    restart: unless-stopped
    profiles:
      - dns

networks:
  proyecto-grado-unad:
    driver: bridge

volumes:
  mysql_data:
  composer_cache:
  vendor_data:
  var_cache_data:
  minio_data: